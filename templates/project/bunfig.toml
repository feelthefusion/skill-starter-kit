# Skill Starter Kit — install hygiene (security-gate layer 5). Bun >= 1.3
[install]
minimumReleaseAge = 604800   # seconds = 7 days; skip versions younger than a week
exact = true                 # no ^ranges — the lockfile is the truth
# trustedDependencies = []   # only listed packages may run lifecycle scripts (Bun default: none)
